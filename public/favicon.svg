<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JE Concept">
  <!--
    Het beeldmerk van JE Concept: de dubbele zeshoek uit het logo, in de inkt
    ervan (#003060) met het bleke blauw erbinnen (#DCE4F0).

    Wat hier stond was de plaatshouder van het eerste uur: drie staafjes in
    ClickUp-blauw op antraciet. Die stond anderhalf jaar in het tabblad van
    iedereen die de tool openhad.
  -->
  <rect width="32" height="32" rx="4" fill="#003060"/>
  <polygon points="16,5 26,10.5 26,21.5 16,27 6,21.5 6,10.5"
           fill="none" stroke="#DCE4F0" stroke-width="1.6"/>
  <polygon points="16,10 21.6,13.1 21.6,18.9 16,22 10.4,18.9 10.4,13.1"
           fill="#DCE4F0"/>
</svg>
