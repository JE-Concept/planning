name: Inloggen nakijken

# Waarom komt iemand niet binnen? Dit leest de echte toestand uit met de
# servicesleutel — en repareert meteen het ding dat je van buitenaf niet ziet:
# een callable v2-functie die niet publiek aanroepbaar staat. De functie
# controleert zelf of je aangemeld bent; zonder die binding krijgt de browser
# een CORS-fout die in de app als "geen toegang" leest.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project-ID'
        required: true
        default: 'je-planning'
        type: string
      email:
        description: 'E-mailadres om na te kijken'
        required: false
        default: 'jasper@kenjeklanten.be'
        type: string

jobs:
  kijk:
    name: Nakijken en repareren
    runs-on: ubuntu-24.04
    env:
      PROJECT: ${{ inputs.project_id }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
      FIREBASE_PROJECT: ${{ inputs.project_id }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Sleutel
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::FIREBASE_SERVICE_ACCOUNT ontbreekt."; exit 1; }
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet

      - run: npm ci --no-audit --no-fund

      - name: Bestaat ensureProfile, en is ze aanroepbaar?
        run: |
          echo "── De functie ───────────────────────────────────────────────"
          gcloud functions describe ensureProfile --gen2 --region europe-west1 \
            --project "$PROJECT" --format 'value(state,serviceConfig.uri)' || \
            echo "::error::ensureProfile bestaat niet in europe-west1."

          echo
          echo "── Wie mag ze aanroepen ─────────────────────────────────────"
          # Een v2-callable draait op Cloud Run. Zonder allUsers als invoker
          # blokkeert Google de aanroep voor de browser komt, en ziet de
          # gebruiker een CORS-fout in plaats van een antwoord.
          beleid=$(gcloud run services get-iam-policy ensureprofile \
            --region europe-west1 --project "$PROJECT" --format json 2>/dev/null || echo '{}')
          echo "$beleid"

          if echo "$beleid" | grep -q '"allUsers"'; then
            echo "  ✔ allUsers mag aanroepen."
          else
            echo "  ✗ allUsers mag NIET aanroepen — dat is de blokkade. Zetten…"
            gcloud run services add-iam-policy-binding ensureprofile \
              --region europe-west1 --project "$PROJECT" \
              --member allUsers --role roles/run.invoker --quiet \
              && echo "  ✔ Gezet. De functie controleert zelf of je aangemeld bent." \
              || echo "::error::Kon de binding niet zetten; de servicesleutel mist run.services.setIamPolicy."
          fi

      - name: Wat zegt de functie zelf?
        run: |
          echo "── Runtime-service-account en haar rechten ──────────────────"
          RUNTIME=$(gcloud functions describe ensureProfile --gen2 --region europe-west1 \
            --project "$PROJECT" --format 'value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          echo "  $RUNTIME"
          if [ -n "$RUNTIME" ]; then
            gcloud projects get-iam-policy "$PROJECT" --flatten 'bindings[].members' \
              --filter "bindings.members:$RUNTIME" --format 'value(bindings.role)' || true
            echo "  Ontbrekend recht toekennen…"
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/datastore.user \
              --condition=None --quiet >/dev/null && echo "  ✔ datastore.user staat er" || true
          fi

          echo
          echo "── De laatste foutmeldingen van ensureProfile ───────────────"
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="ensureprofile" AND severity>=WARNING' \
            --project "$PROJECT" --limit 25 --freshness 2h \
            --format 'value(timestamp, severity, textPayload, jsonPayload.message)' \
            || echo "  (geen logs gelezen — mist de sleutel logging.views.access?)"

      - name: Toegang, mensen en aanmeldmethodes
        run: node scripts/diagnose.mjs "${{ inputs.email }}"

      - name: Sleutel opruimen
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
