name: Canva-geheimen zetten

# Apart van "Go live", zodat een mislukking hier de uitrol niet tegenhoudt.
# De waarden komen uit de GitHub-geheimen en worden doorgezet naar Google
# Secret Manager, waar de Cloud Functions ze lezen. Ze passeren nooit een log.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project-ID'
        required: true
        type: string

jobs:
  secrets:
    name: Canva koppelen aan de functions
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project_id }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Controleer de geheimen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ID: ${{ secrets.CANVA_CLIENT_ID }}
          SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
        run: |
          [ -n "$SA" ]     || { echo "::error::FIREBASE_SERVICE_ACCOUNT ontbreekt."; exit 1; }
          [ -n "$ID" ]     || { echo "::error::CANVA_CLIENT_ID ontbreekt."; exit 1; }
          [ -n "$SECRET" ] || { echo "::error::CANVA_CLIENT_SECRET ontbreekt."; exit 1; }

      - run: npm ci --no-audit --no-fund

      - name: Zetten
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          REDIRECT: https://planning.jeconcept.be/api/canva/callback
        run: |
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          set_secret() {
            printf '%s' "$2" | npx --yes firebase-tools@13 functions:secrets:set "$1" \
              --project "$PROJECT" --data-file - --force --non-interactive
          }
          set_secret CANVA_CLIENT_ID "$CANVA_CLIENT_ID"
          set_secret CANVA_CLIENT_SECRET "$CANVA_CLIENT_SECRET"
          set_secret CANVA_REDIRECT_URI "$REDIRECT"

      # Een nieuwe versie van een geheim bereikt de functions pas bij een deploy.
      - name: Functions opnieuw uitrollen
        run: |
          ( cd functions && npm install --no-audit --no-fund )
          npx --yes firebase-tools@13 deploy --project "$PROJECT" --only functions --non-interactive

      - name: Sleutel opruimen
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
