name: Go live

# Alles wat een terminal zou vragen, met de knop "Run workflow" in de browser.
#
# Het bestaat omdat het live zetten anders vastloopt op de enige stap die een
# browser niet kan: deployen. Wie de console kan bedienen kan nu ook deployen,
# zonder ooit een terminal te openen.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project-ID (zie Project settings → General)'
        required: true
        type: string
      what:
        description: 'Wat uitrollen'
        required: true
        default: 'alles'
        type: choice
        options: [alles, 'alleen rules en indexes', 'alleen de applicatie']
      seed:
        description: 'Basisgegevens zetten (merken, toegangsdomeinen, de borden)'
        required: true
        default: true
        type: boolean

concurrency:
  group: go-live-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  live:
    name: Uitrollen naar ${{ inputs.project_id }}
    runs-on: ubuntu-24.04
    env:
      PROJECT: ${{ inputs.project_id }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
      # Eigen serviceaccounts per codebase (handover A12); leeg = zoals altijd.
      JEPLAN_SA_DEFAULT: ${{ vars.JEPLAN_SA_DEFAULT }}
      JEPLAN_SA_MAIL: ${{ vars.JEPLAN_SA_MAIL }}
      JEPLAN_SA_MEETINGS: ${{ vars.JEPLAN_SA_MEETINGS }}
      JEPLAN_SA_BETALING: ${{ vars.JEPLAN_SA_BETALING }}
      JEPLAN_SA_MESSAGING: ${{ vars.JEPLAN_SA_MESSAGING }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Beter hier stoppen met een leesbare zin dan verderop met een 401.
      - name: Controleer de geheimen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          [ -n "$SA" ]  || { echo "::error::FIREBASE_SERVICE_ACCOUNT ontbreekt. Zie docs/handover-claude-in-chrome.md, stap 7."; exit 1; }
          [ -n "$KEY" ] || { echo "::error::De VITE_FIREBASE_*-geheimen ontbreken. Zie stap 6 en 7."; exit 1; }

      - name: Schrijf de servicesleutel
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e 'JSON.parse(require("fs").readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8"))' \
            || { echo "::error::De servicesleutel is geen geldige JSON. Plak het hele bestand, van { tot }."; exit 1; }

      - run: npm ci --no-audit --no-fund

      # Hosting draait op een target; die staat in .firebaserc vastgelegd op de
      # naam van het oorspronkelijke project. Hier hangen we hem aan het project
      # dat echt gebruikt wordt, zodat een afwijkende project-ID gewoon werkt.
      - name: Koppel het hosting-target
        run: npx --yes firebase-tools@15 target:apply hosting app "$PROJECT" --project "$PROJECT" --non-interactive

      # De Firebase CLI vraagt het facturatieplan op voor ze functions uitrolt,
      # en die API staat op een vers project niet aan.
      - name: Billing-API aanzetten
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud services enable cloudbilling.googleapis.com --project "$PROJECT" --quiet \
            || echo "::warning::cloudbilling.googleapis.com kon niet aangezet worden; zet hem handmatig aan in de Google Cloud console."

      # Rules en indexes eerst: een bord dat zoekt op een veld waarvoor nog geen
      # index bestaat geeft lege kolommen en een fout die op een bug lijkt.
      - name: Rules en indexes
        if: inputs.what != 'alleen de applicatie'
        run: scripts/ci/deploy.sh "$PROJECT" --only firestore:rules,firestore:indexes

      # Apart van Firestore: de storage-deploy controleert eerst of de
      # Storage-API aanstaat, en dat is de stap die als eerste over een
      # ontbrekend IAM-recht valt. Zo blijven de rules en indexes wel staan.
      - name: Storage-rules
        if: inputs.what != 'alleen de applicatie'
        run: scripts/ci/deploy.sh "$PROJECT" --only storage

      - name: Cloud Functions
        if: inputs.what == 'alles'
        run: |
          ( cd functions && npm ci --no-audit --no-fund )
          # Zie ci.yml: zonder opruimregel sluit firebase-tools 15 de uitrol niet af.
          npx --yes firebase-tools@15 functions:artifacts:setpolicy --location europe-west1 --days 7 \
            --force --project "$PROJECT" --non-interactive \
            || echo "::warning::Opruimregel voor function-images niet gezet; de uitrol gaat door."
          # De opruimregel wist images ouder dan een week, ook het image waar een
          # functie nog naar verwijst wanneer ze bij een uitrol niet opnieuw gebouwd
          # wordt — en dan geeft die uitrol "Image … not found". Een bewaarregel
          # houdt per image de vijf nieuwste versies, wat er ook gebeurt: in
          # Artifact Registry wint "Keep" van "Delete". Zonder --overwrite blijft
          # de opruimregel van Firebase gewoon naast deze staan.
          printf '%s' '[{"name":"jeplan-bewaar-recente","action":{"type":"Keep"},"mostRecentVersions":{"keepCount":5}}]' > /tmp/bewaar.json
          gcloud artifacts repositories set-cleanup-policies gcf-artifacts --location europe-west1 \
            --project "$PROJECT" --policy /tmp/bewaar.json --no-dry-run --quiet >/dev/null \
            && echo "Bewaarregel voor de nieuwste images staat." \
            || echo "::warning::Bewaarregel voor function-images niet gezet; de uitrol gaat door."
          scripts/ci/deploy.sh "$PROJECT" --only functions:default

          # Een callable v2-functie draait op Cloud Run en moet publiek
          # aanroepbaar staan; de functie controleert zelf of je aangemeld bent.
          # De CLI zet die binding bij het aanmaken, maar slaat ze over zodra ze
          # de functie als "ongewijzigd" beschouwt — dus na een half mislukte
          # eerste uitrol blijft ze ontbreken, en ziet de gebruiker een
          # CORS-fout die in de app als "geen toegang" leest.
          gcloud run services add-iam-policy-binding ensureprofile \
            --region europe-west1 --project "$PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op ensureprofile."

          # De adressen die zonder login te openen horen te zijn: een
          # agenda-abonnement kan geen aanmeldscherm tonen, een klant die zijn
          # offerte opent hoort er geen account voor nodig te hebben, en de
          # verhuursite is een publieke etalage. De sleutel in het adres (of,
          # bij de verhuur, de selectie van velden) is wat ze afschermt; welke
          # velden er naar buiten gaan beslist de functie zelf.
          for dienst in agenda portaal verhuur drive; do
            gcloud run services add-iam-policy-binding "$dienst" \
              --region europe-west1 --project "$PROJECT" \
              --member allUsers --role roles/run.invoker --quiet \
              || echo "::warning::Kon allUsers/run.invoker niet zetten op $dienst."
          done

          # De functie draait onder haar eigen runtime-service-account. Op een
          # vers project krijgt die niet meer automatisch Editor, en zonder
          # Firestore-recht crasht ensureProfile bij de eerste lees — wat bij de
          # client aankomt als [functions/internal], niet als een weigering.
          RUNTIME=$(gcloud functions describe ensureProfile --gen2 --region europe-west1 \
            --project "$PROJECT" --format 'value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          if [ -n "$RUNTIME" ]; then
            echo "Runtime-service-account: $RUNTIME"
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/datastore.user \
              --condition=None --quiet >/dev/null \
              && echo "  ✔ datastore.user toegekend" \
              || { \
                echo "::error::De servicesleutel mag geen rollen uitdelen (Editor kan dat niet)."; \
                echo "::error::Kies één van twee, in https://console.cloud.google.com/iam-admin/iam :"; \
                echo "::error::  A. geef firebase-adminsdk-…@ de rol \"Project IAM Admin\" — dan doet de uitrol dit voortaan zelf;"; \
                echo "::error::  B. geef $RUNTIME de rol \"Cloud Datastore User\" — de eenmalige reparatie."; \
              }
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/firebaseauth.admin \
              --condition=None --quiet >/dev/null || true
          else
            echo "::warning::Runtime-service-account van ensureProfile niet gevonden."
          fi

          # De overlegfuncties staan in een eigen codebase omdat ze aan een
          # geheim hangen. Ze worden apart uitgerold en mogen falen: zonder de
          # Claude-sleutel werkt het samenvatten niet, maar inloggen wel — en
          # dat is precies de volgorde die eerder omgekeerd lag.
          if scripts/ci/geheim.sh ANTHROPIC_API_KEY "$PROJECT"; then
            ( cd functions-meetings && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$PROJECT" --only functions:meetings \
              || echo "::warning::De overlegfuncties zijn niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Geheim ANTHROPIC_API_KEY bestaat niet in dit project — overlegfuncties overgeslagen."
          fi

          # Hetzelfde verhaal voor de mailverzender: eigen codebase, eigen
          # geheim. Zonder SMTP_URL blijven de meldingen in `mailQueue` staan
          # in plaats van te vertrekken — de rest van de tool merkt er niets van.
          #
          # `geheim.sh` en niet `gcloud secrets describe`: dat laatste faalt ook
          # wanneer het geheim bestaat maar deze sleutel er niet in mag kijken,
          # en dan werd de mailverzender maanden overgeslagen met de melding dat
          # het geheim niet bestond. Zie het script.
          if scripts/ci/geheim.sh SMTP_URL "$PROJECT"; then
            ( cd functions-mail && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$PROJECT" --only functions:mail \
              || echo "::warning::De mailverzender is niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Geheim SMTP_URL bestaat niet in dit project — er wordt niet gemaild, alleen gepusht."
          fi

          # En nog eens hetzelfde voor het afrekenen. Stripe hangt aan twee
          # geheimen — de API-sleutel en het ondertekeningsgeheim van het
          # webhook-adres — en zonder allebei heeft uitrollen geen zin: een
          # webhook zonder handtekeningcontrole zou erger zijn dan geen webhook.
          #
          # Ontbreekt er een, dan staat alleen de knop "online huren" stil. Het
          # magazijn, de reservaties van eigen events en de rest van de tool
          # merken er niets van, want die schrijven niet in `huurorders`.
          if scripts/ci/geheim.sh STRIPE_SECRET "$PROJECT" \
            && scripts/ci/geheim.sh STRIPE_WEBHOOK_SECRET "$PROJECT"; then
            ( cd functions-betaling && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$PROJECT" --only functions:betaling \
              || echo "::warning::Het afrekenen is niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Stripe-geheimen ontbreken in dit project — online afrekenen staat uit, de rest draait."
          fi

          # De ontvanger van Wintermoods-aanvragen: zelfde wacht, zelfde reden.
          # Zie ci.yml en functions-messaging/messaging.js.
          if scripts/ci/geheim.sh MESSAGING_TOKENS "$PROJECT"; then
            ( cd functions-messaging && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$PROJECT" --only functions:messaging \
              || echo "::warning::De messaging-ingang is niet uitgerold; de rest staat wel live."
            gcloud run services add-iam-policy-binding messaging \
              --region europe-west1 --project "$PROJECT" \
              --member allUsers --role roles/run.invoker --quiet \
              || echo "::warning::Kon allUsers/run.invoker niet zetten op messaging."
          else
            echo "::warning::Geheim MESSAGING_TOKENS bestaat niet in dit project — berichten van buiten (Wintermoods) komen niet binnen, de rest draait."
          fi


      - name: Basisgegevens
        if: inputs.seed && inputs.what != 'alleen de applicatie'
        run: node scripts/seed.mjs

      - name: De applicatie bouwen
        if: inputs.what != 'alleen rules en indexes'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Zonder deze sleutel blijft het locatieveld op een event een gewoon
          # tekstveld: geen adressenlijst, wel gewoon typen. Zie .env.example.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # App Check (A11). Leeg = uit; zie src/lib/firebase.js.
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}
          # Waaraan een openstaand tabblad ziet dat er iets nieuws uitgerold is.
          BUILD_ID: ${{ github.sha }}
        run: npm run build

      # De verhuursite is een eigen bundel met een eigen uitgang. Geen enkele
      # VITE_FIREBASE-sleutel: die site praat niet met Firestore maar met één
      # HTTP-adres, en een projectsleutel die nergens voor nodig is, hoort niet
      # in een publieke bundel. Zie `vite.verhuur.config.js`.
      - name: Build verhuursite
        if: inputs.what != 'alleen rules en indexes'
        run: npm run build:verhuur

      - name: Publiceren
        if: inputs.what != 'alleen rules en indexes'
        run: |
          # De backoffice eerst en los van de verhuursite: één `--only hosting`
          # rolt beide sites in één beweging uit, en als de tweede site nog niet
          # bestaat gaat daarmee óók de backoffice niet live. Zie ci.yml.
          scripts/ci/deploy.sh "$PROJECT" --only hosting:app
          npx --yes firebase-tools@15 hosting:sites:create "$PROJECT-verhuur" --project "$PROJECT" >/dev/null 2>&1 \
            || echo "::notice::Site $PROJECT-verhuur niet aangemaakt (bestaat al, of de sleutel mag het niet)."
          scripts/ci/deploy.sh "$PROJECT" --only hosting:verhuur \
            || echo "::warning::De verhuursite is niet uitgerold — bestaat de site $PROJECT-verhuur in Firebase Hosting? De backoffice staat wel live."

      # Zie ci.yml: een publiek adres dat een 403 van Cloud Run geeft, is een
      # mislukte uitrol.
      - name: Na de uitrol, publieke adressen
        if: inputs.what == 'alles'
        run: scripts/ci/na-uitrol.sh "$PROJECT"

      - name: Sleutel opruimen
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Waar het nu staat
        if: success()
        run: |
          {
            echo "### Live"
            echo ""
            echo "- https://$PROJECT.web.app"
            echo "- https://planning.jeconcept.be (zodra het domein gekoppeld is)"
            echo ""
            echo "De eerste die inlogt wordt eigenaar van de werkruimte. Doe dat zelf."
          } >> "$GITHUB_STEP_SUMMARY"
