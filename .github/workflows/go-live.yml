name: Go live

# Alles wat een terminal zou vragen, met de knop "Run workflow" in de browser.
#
# Het bestaat omdat het live zetten anders vastloopt op de enige stap die een
# browser niet kan: deployen. Wie de console kan bedienen kan nu ook deployen,
# zonder ooit een terminal te openen.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project-ID (zie Project settings → General)'
        required: true
        type: string
      what:
        description: 'Wat uitrollen'
        required: true
        default: 'alles'
        type: choice
        options: [alles, 'alleen rules en indexes', 'alleen de applicatie']
      seed:
        description: 'Basisgegevens zetten (merken, toegangsdomeinen, de borden)'
        required: true
        default: true
        type: boolean

concurrency:
  group: go-live-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  live:
    name: Uitrollen naar ${{ inputs.project_id }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project_id }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Beter hier stoppen met een leesbare zin dan verderop met een 401.
      - name: Controleer de geheimen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          [ -n "$SA" ]  || { echo "::error::FIREBASE_SERVICE_ACCOUNT ontbreekt. Zie docs/handover-claude-in-chrome.md, stap 7."; exit 1; }
          [ -n "$KEY" ] || { echo "::error::De VITE_FIREBASE_*-geheimen ontbreken. Zie stap 6 en 7."; exit 1; }

      - name: Schrijf de servicesleutel
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e 'JSON.parse(require("fs").readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8"))' \
            || { echo "::error::De servicesleutel is geen geldige JSON. Plak het hele bestand, van { tot }."; exit 1; }

      - run: npm ci --no-audit --no-fund

      # Hosting draait op een target; die staat in .firebaserc vastgelegd op de
      # naam van het oorspronkelijke project. Hier hangen we hem aan het project
      # dat echt gebruikt wordt, zodat een afwijkende project-ID gewoon werkt.
      - name: Koppel het hosting-target
        run: npx --yes firebase-tools@13 target:apply hosting app "$PROJECT" --project "$PROJECT" --non-interactive

      # De Firebase CLI vraagt het facturatieplan op voor ze functions uitrolt,
      # en die API staat op een vers project niet aan.
      - name: Billing-API aanzetten
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud services enable cloudbilling.googleapis.com --project "$PROJECT" --quiet \
            || echo "::warning::cloudbilling.googleapis.com kon niet aangezet worden; zet hem handmatig aan in de Google Cloud console."

      # Rules en indexes eerst: een bord dat zoekt op een veld waarvoor nog geen
      # index bestaat geeft lege kolommen en een fout die op een bug lijkt.
      - name: Rules en indexes
        if: inputs.what != 'alleen de applicatie'
        run: scripts/ci/deploy.sh "$PROJECT" --only firestore:rules,firestore:indexes

      # Apart van Firestore: de storage-deploy controleert eerst of de
      # Storage-API aanstaat, en dat is de stap die als eerste over een
      # ontbrekend IAM-recht valt. Zo blijven de rules en indexes wel staan.
      - name: Storage-rules
        if: inputs.what != 'alleen de applicatie'
        run: scripts/ci/deploy.sh "$PROJECT" --only storage

      - name: Cloud Functions
        if: inputs.what == 'alles'
        run: |
          ( cd functions && npm install --no-audit --no-fund )
          scripts/ci/deploy.sh "$PROJECT" --only functions:default

          # Een callable v2-functie draait op Cloud Run en moet publiek
          # aanroepbaar staan; de functie controleert zelf of je aangemeld bent.
          # De CLI zet die binding bij het aanmaken, maar slaat ze over zodra ze
          # de functie als "ongewijzigd" beschouwt — dus na een half mislukte
          # eerste uitrol blijft ze ontbreken, en ziet de gebruiker een
          # CORS-fout die in de app als "geen toegang" leest.
          gcloud run services add-iam-policy-binding ensureprofile \
            --region europe-west1 --project "$PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op ensureprofile."

          # De functie draait onder haar eigen runtime-service-account. Op een
          # vers project krijgt die niet meer automatisch Editor, en zonder
          # Firestore-recht crasht ensureProfile bij de eerste lees — wat bij de
          # client aankomt als [functions/internal], niet als een weigering.
          RUNTIME=$(gcloud functions describe ensureProfile --gen2 --region europe-west1 \
            --project "$PROJECT" --format 'value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          if [ -n "$RUNTIME" ]; then
            echo "Runtime-service-account: $RUNTIME"
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/datastore.user \
              --condition=None --quiet >/dev/null \
              && echo "  ✔ datastore.user toegekend" \
              || { \
                echo "::error::De servicesleutel mag geen rollen uitdelen (Editor kan dat niet)."; \
                echo "::error::Kies één van twee, in https://console.cloud.google.com/iam-admin/iam :"; \
                echo "::error::  A. geef firebase-adminsdk-…@ de rol \"Project IAM Admin\" — dan doet de uitrol dit voortaan zelf;"; \
                echo "::error::  B. geef $RUNTIME de rol \"Cloud Datastore User\" — de eenmalige reparatie."; \
              }
            gcloud projects add-iam-policy-binding "$PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/firebaseauth.admin \
              --condition=None --quiet >/dev/null || true
          else
            echo "::warning::Runtime-service-account van ensureProfile niet gevonden."
          fi

          # De overlegfuncties staan in een eigen codebase omdat ze aan een
          # geheim hangen. Ze worden apart uitgerold en mogen falen: zonder de
          # Claude-sleutel werkt het samenvatten niet, maar inloggen wel — en
          # dat is precies de volgorde die eerder omgekeerd lag.
          if gcloud secrets describe ANTHROPIC_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            ( cd functions-meetings && npm install --no-audit --no-fund )
            scripts/ci/deploy.sh "$PROJECT" --only functions:meetings \
              || echo "::warning::De overlegfuncties zijn niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Geheim ANTHROPIC_API_KEY bestaat niet — overlegfuncties overgeslagen."
          fi


      - name: Basisgegevens
        if: inputs.seed && inputs.what != 'alleen de applicatie'
        run: node scripts/seed.mjs

      - name: De applicatie bouwen
        if: inputs.what != 'alleen rules en indexes'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}
        run: npm run build

      - name: Publiceren
        if: inputs.what != 'alleen rules en indexes'
        run: scripts/ci/deploy.sh "$PROJECT" --only hosting

      - name: Sleutel opruimen
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Waar het nu staat
        if: success()
        run: |
          {
            echo "### Live"
            echo ""
            echo "- https://$PROJECT.web.app"
            echo "- https://planning.jeconcept.be (zodra het domein gekoppeld is)"
            echo ""
            echo "De eerste die inlogt wordt eigenaar van de werkruimte. Doe dat zelf."
          } >> "$GITHUB_STEP_SUMMARY"
