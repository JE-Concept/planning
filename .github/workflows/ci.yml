name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # De Firestore-emulator draait op Java. Die staat op de runner, maar
      # niet altijd in een versie die de emulator aanvaardt; vastzetten scheelt
      # een test die op een dinsdag ineens niet meer start.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      # Een paar tests laten de echte functions-code lopen (de bedrading van
      # messaging, de ingang en de Stripe-webhook tegen de emulator), en die
      # importeert firebase-functions en stripe uit haar eigen map.
      - run: npm ci --no-audit --no-fund --prefix functions
      - run: npm ci --no-audit --no-fund --prefix functions-messaging
      - run: npm ci --no-audit --no-fund --prefix functions-betaling
      - run: npm run lint
      - run: npm test

      # Geen bekende lekken van niveau hoog in wat er live draait: de bundel en
      # elke functions-codebase. Ontwikkeltools (vite, vitest) tellen hier niet
      # mee; die draaien nooit bij een bezoeker. Dependabot stelt elke week de
      # upgrades voor (.github/dependabot.yml).
      - name: Audit
        run: |
          npm audit --omit=dev --audit-level=high
          for d in functions functions-mail functions-meetings functions-betaling functions-messaging; do
            echo "── $d"; ( cd "$d" && npm audit --omit=dev --audit-level=high )
          done

      # De echte `firestore.rules` tegen een echte database. Dit draait niet
      # mee in `npm test` omdat het een emulator nodig heeft (en dus Java);
      # lokaal slaan die tests zichzelf over en zeggen ze dat. Hier moeten ze
      # wél draaien: een fout in de rules kwam tot nu pas in productie aan het
      # licht, op een tool waar klantgegevens en bedragen in staan.
      - name: Regeltest
        run: npm run test:rules

      # De browsertest draait de echte app op de demobuild: elke pagina open,
      # geen wit scherm, geen fout in de console. De unittests dekken het
      # rekenwerk; dit dekt wat mensen overkomt.
      - name: Browsertest
        run: |
          npx playwright install --with-deps chromium
          npm run build:demo
          node scripts/smoke.mjs

      # Past elk scherm op een telefoon? Niet met het oog maar gemeten: wat er
      # buiten het scherm valt en welke knoppen te klein zijn om met een duim
      # te raken. Zie scripts/mobiel.mjs.
      - name: Telefoontest
        run: node scripts/mobiel.mjs

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Zonder deze sleutel bouwt alles gewoon, maar blijft de knop
          # "Meldingen aanzetten" uitgeschakeld. Zie README → Op de telefoon.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Zonder deze sleutel blijft het locatieveld op een event een gewoon
          # tekstveld: geen adressenlijst, wel gewoon typen. Zie .env.example.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # App Check (A11). Leeg = uit; zie src/lib/firebase.js.
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}

      # De verhuursite is een eigen bundel met een eigen uitgang. Geen enkele
      # VITE_FIREBASE-sleutel: die site praat niet met Firestore maar met één
      # HTTP-adres, en een projectsleutel die nergens voor nodig is, hoort niet
      # in een publieke bundel. Zie `vite.verhuur.config.js`.
      - name: Build verhuursite
        run: npm run build:verhuur

  deploy:
    name: Deploy to Firebase
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    # The `secrets` context cannot be read in a step-level `if`, so the presence
    # of the key travels through `env` instead. Without it, CI still runs green
    # and simply skips the deploy.
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Zonder deze sleutel bouwt alles gewoon, maar blijft de knop
          # "Meldingen aanzetten" uitgeschakeld. Zie README → Op de telefoon.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Zonder deze sleutel blijft het locatieveld op een event een gewoon
          # tekstveld: geen adressenlijst, wel gewoon typen. Zie .env.example.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # App Check (A11). Leeg = uit; zie src/lib/firebase.js.
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}

      # De verhuursite is een eigen bundel met een eigen uitgang (`dist-verhuur`).
      # Ze stond ooit in git en rolde daardoor "vanzelf" mee uit; sinds ze
      # bouwuitvoer is zoals het hoort, moet ze hier gebouwd worden, anders
      # meldt de uitrol dat de map niet bestaat. Geen VITE_FIREBASE-sleutel:
      # die site praat niet met Firestore. Zie `vite.verhuur.config.js`.
      - name: Build verhuursite
        run: npm run build:verhuur

      # De functions hebben hun eigen node_modules. Zonder deze install vindt
      # de CLI firebase-functions niet, mislukt het parsen van de triggers, en
      # landt ensureProfile niet — waarna niemand meer kan inloggen.
      - name: Functions-afhankelijkheden
        if: env.HAS_CREDENTIALS == 'true'
        run: cd functions && npm ci --no-audit --no-fund

      # De Firebase CLI vraagt het facturatieplan op voor ze functions
      # uitrolt, en die API staat op een vers project niet aan. Ze zet run en
      # eventarc wel zelf aan maar deze niet, dus doen we het hier — met de
      # sleutel die er toch al is.
      - name: Billing-API aanzetten
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud services enable cloudbilling.googleapis.com --project "$FIREBASE_PROJECT" --quiet \
            || echo "::warning::cloudbilling.googleapis.com kon niet aangezet worden; zet hem handmatig aan in de Google Cloud console."

      # Rules, indexes, functions, basisgegevens en de applicatie horen bij
      # elkaar: een bord dat zoekt op een veld waarvoor nog geen index bestaat
      # is een kapot bord, en een lijst zonder basisgegevens is een leeg scherm.
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          # Een eigen serviceaccount per codebase (handover A12). Leeg = het
          # standaard compute-account, zoals altijd; zie functions/runtime.js.
          JEPLAN_SA_DEFAULT: ${{ vars.JEPLAN_SA_DEFAULT }}
          JEPLAN_SA_MAIL: ${{ vars.JEPLAN_SA_MAIL }}
          JEPLAN_SA_MEETINGS: ${{ vars.JEPLAN_SA_MEETINGS }}
          JEPLAN_SA_BETALING: ${{ vars.JEPLAN_SA_BETALING }}
          JEPLAN_SA_MESSAGING: ${{ vars.JEPLAN_SA_MESSAGING }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # De hosting-target staat in .firebaserc op de oorspronkelijke
          # projectnaam; hier hangen we hem aan het project dat echt draait.
          npx --yes firebase-tools@15 target:apply hosting app "$FIREBASE_PROJECT" \
            --project "$FIREBASE_PROJECT" --non-interactive
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only firestore:rules,firestore:indexes,storage

          # Oude function-images ruimt Artifact Registry zelf op na een week.
          # firebase-tools 15 weigert anders de uitrol af te sluiten zonder
          # --force; een week laat ruimte om naar een vorige revisie terug te gaan.
          npx --yes firebase-tools@15 functions:artifacts:setpolicy --location europe-west1 --days 7 \
            --force --project "$FIREBASE_PROJECT" --non-interactive \
            || echo "::warning::Opruimregel voor function-images niet gezet; de uitrol gaat door."
          # De opruimregel wist images ouder dan een week, ook het image waar een
          # functie nog naar verwijst wanneer ze bij een uitrol niet opnieuw gebouwd
          # wordt — en dan geeft die uitrol "Image … not found". Een bewaarregel
          # houdt per image de vijf nieuwste versies, wat er ook gebeurt: in
          # Artifact Registry wint "Keep" van "Delete". Zonder --overwrite blijft
          # de opruimregel van Firebase gewoon naast deze staan.
          printf '%s' '[{"name":"jeplan-bewaar-recente","action":{"type":"Keep"},"mostRecentVersions":{"keepCount":5}}]' > /tmp/bewaar.json
          gcloud artifacts repositories set-cleanup-policies gcf-artifacts --location europe-west1 \
            --project "$FIREBASE_PROJECT" --policy /tmp/bewaar.json --no-dry-run --quiet >/dev/null \
            && echo "Bewaarregel voor de nieuwste images staat." \
            || echo "::warning::Bewaarregel voor function-images niet gezet; de uitrol gaat door."
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions:default

          # Een callable v2-functie draait op Cloud Run en moet publiek
          # aanroepbaar staan; de functie controleert zelf of je aangemeld bent.
          # De CLI zet die binding bij het aanmaken, maar slaat ze over zodra ze
          # de functie als "ongewijzigd" beschouwt — dus na een half mislukte
          # eerste uitrol blijft ze ontbreken, en ziet de gebruiker een
          # CORS-fout die in de app als "geen toegang" leest.
          gcloud run services add-iam-policy-binding ensureprofile \
            --region europe-west1 --project "$FIREBASE_PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op ensureprofile."

          # Dezelfde ingreep voor de agenda-feed, om een tweede reden. Die rolt
          # met `invoker: 'private'` uit, want anders wil de CLI zelf een
          # IAM-binding zetten en dat mag dit serviceaccount niet
          # (`cloudfunctions.functions.setIamPolicy`) — waarop de hele
          # functions-uitrol strandde, alle andere functies inbegrepen.
          # Op Cloud Run-niveau mag het account het wél; vandaar hier.
          # Een agenda-abonnement kan geen aanmeldscherm tonen, dus moet dit
          # adres zonder login te openen zijn; de sleutel in het adres is wat
          # het afschermt. Zie functions/agenda.js.
          gcloud run services add-iam-policy-binding agenda \
            --region europe-west1 --project "$FIREBASE_PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op agenda — de feed is dan niet bereikbaar."

          # En voor het klantenportaal, om precies dezelfde reden. Een klant
          # die zijn offerte opent heeft geen account en hoort er ook geen
          # nodig te hebben; de sleutel in het adres is wat het afschermt, en
          # welke velden hij te zien krijgt beslist de functie zelf. Zie
          # functions/portaal.js.
          gcloud run services add-iam-policy-binding portaal \
            --region europe-west1 --project "$FIREBASE_PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op portaal — de klantenpagina is dan niet bereikbaar."

          # En de verhuursite: haar aanbod, de beschikbaarheid en de aanvragen
          # komen allemaal via deze ene functie. De code zet ze al op `public`;
          # dit is het vangnet, want zonder deze binding toont rental.jeconcept.be
          # een lege etalage (403 op /api/verhuur/aanbod).
          gcloud run services add-iam-policy-binding verhuur \
            --region europe-west1 --project "$FIREBASE_PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op verhuur — de verhuursite toont dan geen aanbod."

          # De documenten: Hosting stuurt /api/drive/** zonder Google-identiteit
          # door; de functie controleert zelf het Firebase-token.
          gcloud run services add-iam-policy-binding drive \
            --region europe-west1 --project "$FIREBASE_PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op drive — documenten uploaden lukt dan niet."

          # De functie draait onder haar eigen runtime-service-account. Op een
          # vers project krijgt die niet meer automatisch Editor, en zonder
          # Firestore-recht crasht ensureProfile bij de eerste lees — wat bij de
          # client aankomt als [functions/internal], niet als een weigering.
          RUNTIME=$(gcloud functions describe ensureProfile --gen2 --region europe-west1 \
            --project "$FIREBASE_PROJECT" --format 'value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          if [ -n "$RUNTIME" ]; then
            echo "Runtime-service-account: $RUNTIME"
            gcloud projects add-iam-policy-binding "$FIREBASE_PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/datastore.user \
              --condition=None --quiet >/dev/null \
              && echo "  ✔ datastore.user toegekend" \
              || { \
                echo "::error::De servicesleutel mag geen rollen uitdelen (Editor kan dat niet)."; \
                echo "::error::Kies één van twee, in https://console.cloud.google.com/iam-admin/iam :"; \
                echo "::error::  A. geef firebase-adminsdk-…@ de rol \"Project IAM Admin\" — dan doet de uitrol dit voortaan zelf;"; \
                echo "::error::  B. geef $RUNTIME de rol \"Cloud Datastore User\" — de eenmalige reparatie."; \
              }
            gcloud projects add-iam-policy-binding "$FIREBASE_PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/firebaseauth.admin \
              --condition=None --quiet >/dev/null || true
          else
            echo "::warning::Runtime-service-account van ensureProfile niet gevonden."
          fi

          # De overlegfuncties staan in een eigen codebase omdat ze aan een
          # geheim hangen. Ze worden apart uitgerold en mogen falen: zonder de
          # Claude-sleutel werkt het samenvatten niet, maar inloggen wel — en
          # dat is precies de volgorde die eerder omgekeerd lag.
          if scripts/ci/geheim.sh ANTHROPIC_API_KEY "$FIREBASE_PROJECT"; then
            ( cd functions-meetings && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions:meetings \
              || echo "::warning::De overlegfuncties zijn niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Geheim ANTHROPIC_API_KEY bestaat niet in dit project — overlegfuncties overgeslagen."
          fi

          # Hetzelfde verhaal voor de mailverzender: eigen codebase, eigen
          # geheim. Zonder SMTP_URL blijven de meldingen in `mailQueue` staan
          # in plaats van te vertrekken — de rest van de tool merkt er niets van.
          #
          # `geheim.sh` en niet `gcloud secrets describe`: dat laatste faalt ook
          # wanneer het geheim bestaat maar deze sleutel er niet in mag kijken,
          # en dan werd de mailverzender maanden overgeslagen met de melding dat
          # het geheim niet bestond. Zie het script.
          if scripts/ci/geheim.sh SMTP_URL "$FIREBASE_PROJECT"; then
            ( cd functions-mail && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions:mail \
              || echo "::warning::De mailverzender is niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Geheim SMTP_URL bestaat niet in dit project — er wordt niet gemaild, alleen gepusht."
          fi

          # En nog eens hetzelfde voor het afrekenen. Stripe hangt aan twee
          # geheimen — de API-sleutel en het ondertekeningsgeheim van het
          # webhook-adres — en zonder allebei heeft uitrollen geen zin: een
          # webhook zonder handtekeningcontrole zou erger zijn dan geen webhook.
          #
          # Ontbreekt er een, dan staat alleen de knop "online huren" stil. Het
          # magazijn, de reservaties van eigen events en de rest van de tool
          # merken er niets van, want die schrijven niet in `huurorders`.
          if scripts/ci/geheim.sh STRIPE_SECRET "$FIREBASE_PROJECT" \
            && scripts/ci/geheim.sh STRIPE_WEBHOOK_SECRET "$FIREBASE_PROJECT"; then
            ( cd functions-betaling && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions:betaling \
              || echo "::warning::Het afrekenen is niet uitgerold; de rest staat wel live."
          else
            echo "::warning::Stripe-geheimen ontbreken in dit project — online afrekenen staat uit, de rest draait."
          fi

          # Messaging: de ene ingang voor berichten van buiten (Wintermoods, en
          # straks Bar Vue en Feestbeest). Ze hangt aan één geheim met een token
          # per bron. Zonder geheim is het adres een formulier dat iedereen op
          # het bord kan zetten, dus dan rollen we het niet uit; de sites
          # mailen gewoon verder. Publiek bereikbaar maken gaat net als bij
          # portaal: de functie controleert de token, de IAM-binding laat het
          # verkeer door.
          if scripts/ci/geheim.sh MESSAGING_TOKENS "$FIREBASE_PROJECT"; then
            ( cd functions-messaging && npm ci --no-audit --no-fund )
            scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions:messaging \
              || echo "::warning::De messaging-ingang is niet uitgerold; de rest staat wel live."
            gcloud run services add-iam-policy-binding messaging \
              --region europe-west1 --project "$FIREBASE_PROJECT" \
              --member allUsers --role roles/run.invoker --quiet \
              || echo "::warning::Kon allUsers/run.invoker niet zetten op messaging — berichten van buiten komen dan niet binnen."
          else
            echo "::warning::Geheim MESSAGING_TOKENS bestaat niet in dit project — berichten van buiten (Wintermoods) komen niet binnen, de rest draait."
          fi
          node scripts/seed.mjs
          # De backoffice eerst en los van de verhuursite. Eén `--only hosting`
          # rolt beide sites in één beweging uit, en toen de tweede site nog niet
          # bestond (404 op sites/je-planning-verhuur) ging daarmee óók de
          # backoffice niet live — terwijl die er niets mee te maken had.
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only hosting:app

          # De verhuursite: eerst proberen de site aan te maken (doet niets als
          # ze er al is), dan uitrollen. Mislukt het, dan staat de backoffice
          # wél live en zegt de uitrol wat eraan scheelt.
          npx --yes firebase-tools@15 hosting:sites:create "$FIREBASE_PROJECT-verhuur" --project "$FIREBASE_PROJECT" >/dev/null 2>&1 \
            || echo "::notice::Site $FIREBASE_PROJECT-verhuur niet aangemaakt (bestaat al, of de sleutel mag het niet)."
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only hosting:verhuur \
            || echo "::warning::De verhuursite is niet uitgerold — bestaat de site $FIREBASE_PROJECT-verhuur in Firebase Hosting? De backoffice staat wel live."

      # Van buitenaf, zoals een bezoeker: geeft een publiek adres een 403 van
      # Cloud Run, dan is de uitrol niet geslaagd, ook al is alles hierboven
      # groen. Zo bleef de etalage van rental.jeconcept.be ooit leeg.
      - name: Na de uitrol, publieke adressen
        if: env.HAS_CREDENTIALS == 'true'
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: scripts/ci/na-uitrol.sh "$FIREBASE_PROJECT"

      - name: Sleutel opruimen
        if: always()
        run: rm -f "${{ github.workspace }}/service-account.json"
