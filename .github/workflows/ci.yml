name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}

  deploy:
    name: Deploy to Firebase
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `secrets` context cannot be read in a step-level `if`, so the presence
    # of the key travels through `env` instead. Without it, CI still runs green
    # and simply skips the deploy.
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}

      # De functions hebben hun eigen node_modules. Zonder deze install vindt
      # de CLI firebase-functions niet, mislukt het parsen van de triggers, en
      # landt ensureProfile niet — waarna niemand meer kan inloggen.
      - name: Functions-afhankelijkheden
        if: env.HAS_CREDENTIALS == 'true'
        run: cd functions && npm install --no-audit --no-fund

      # Rules, indexes, functions, basisgegevens en de applicatie horen bij
      # elkaar: een bord dat zoekt op een veld waarvoor nog geen index bestaat
      # is een kapot bord, en een lijst zonder basisgegevens is een leeg scherm.
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # De hosting-target staat in .firebaserc op de oorspronkelijke
          # projectnaam; hier hangen we hem aan het project dat echt draait.
          npx --yes firebase-tools@13 target:apply hosting app "$FIREBASE_PROJECT" \
            --project "$FIREBASE_PROJECT" --non-interactive
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only firestore:rules,firestore:indexes,storage
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions
          node scripts/seed.mjs
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only hosting

      - name: Sleutel opruimen
        if: always()
        run: rm -f "${{ github.workspace }}/service-account.json"
