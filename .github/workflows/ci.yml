name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}

  deploy:
    name: Deploy to Firebase
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `secrets` context cannot be read in a step-level `if`, so the presence
    # of the key travels through `env` instead. Without it, CI still runs green
    # and simply skips the deploy.
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: https://planning.jeconcept.be
          VITE_CANONICAL_HOST: ${{ secrets.VITE_CANONICAL_HOST }}

      # De functions hebben hun eigen node_modules. Zonder deze install vindt
      # de CLI firebase-functions niet, mislukt het parsen van de triggers, en
      # landt ensureProfile niet — waarna niemand meer kan inloggen.
      - name: Functions-afhankelijkheden
        if: env.HAS_CREDENTIALS == 'true'
        run: cd functions && npm install --no-audit --no-fund

      # De Firebase CLI vraagt het facturatieplan op voor ze functions
      # uitrolt, en die API staat op een vers project niet aan. Ze zet run en
      # eventarc wel zelf aan maar deze niet, dus doen we het hier — met de
      # sleutel die er toch al is.
      - name: Billing-API aanzetten
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud services enable cloudbilling.googleapis.com --project "$FIREBASE_PROJECT" --quiet \
            || echo "::warning::cloudbilling.googleapis.com kon niet aangezet worden; zet hem handmatig aan in de Google Cloud console."

      # Rules, indexes, functions, basisgegevens en de applicatie horen bij
      # elkaar: een bord dat zoekt op een veld waarvoor nog geen index bestaat
      # is een kapot bord, en een lijst zonder basisgegevens is een leeg scherm.
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # De hosting-target staat in .firebaserc op de oorspronkelijke
          # projectnaam; hier hangen we hem aan het project dat echt draait.
          npx --yes firebase-tools@13 target:apply hosting app "$FIREBASE_PROJECT" \
            --project "$FIREBASE_PROJECT" --non-interactive
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only firestore:rules,firestore:indexes,storage
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only functions

          # Een callable v2-functie draait op Cloud Run en moet publiek
          # aanroepbaar staan; de functie controleert zelf of je aangemeld bent.
          # De CLI zet die binding bij het aanmaken, maar slaat ze over zodra ze
          # de functie als "ongewijzigd" beschouwt — dus na een half mislukte
          # eerste uitrol blijft ze ontbreken, en ziet de gebruiker een
          # CORS-fout die in de app als "geen toegang" leest.
          gcloud run services add-iam-policy-binding ensureprofile \
            --region europe-west1 --project "$FIREBASE_PROJECT" \
            --member allUsers --role roles/run.invoker --quiet \
            || echo "::warning::Kon allUsers/run.invoker niet zetten op ensureprofile."

          # De functie draait onder haar eigen runtime-service-account. Op een
          # vers project krijgt die niet meer automatisch Editor, en zonder
          # Firestore-recht crasht ensureProfile bij de eerste lees — wat bij de
          # client aankomt als [functions/internal], niet als een weigering.
          RUNTIME=$(gcloud functions describe ensureProfile --gen2 --region europe-west1 \
            --project "$FIREBASE_PROJECT" --format 'value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          if [ -n "$RUNTIME" ]; then
            echo "Runtime-service-account: $RUNTIME"
            gcloud projects add-iam-policy-binding "$FIREBASE_PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/datastore.user \
              --condition=None --quiet >/dev/null \
              && echo "  ✔ datastore.user toegekend" \
              || { \
                echo "::error::De servicesleutel mag geen rollen uitdelen (Editor kan dat niet)."; \
                echo "::error::Kies één van twee, in https://console.cloud.google.com/iam-admin/iam :"; \
                echo "::error::  A. geef firebase-adminsdk-…@ de rol \"Project IAM Admin\" — dan doet de uitrol dit voortaan zelf;"; \
                echo "::error::  B. geef $RUNTIME de rol \"Cloud Datastore User\" — de eenmalige reparatie."; \
              }
            gcloud projects add-iam-policy-binding "$FIREBASE_PROJECT" \
              --member "serviceAccount:$RUNTIME" --role roles/firebaseauth.admin \
              --condition=None --quiet >/dev/null || true
          else
            echo "::warning::Runtime-service-account van ensureProfile niet gevonden."
          fi
          node scripts/seed.mjs
          scripts/ci/deploy.sh "$FIREBASE_PROJECT" --only hosting

      - name: Sleutel opruimen
        if: always()
        run: rm -f "${{ github.workspace }}/service-account.json"
